name: CI security baseline

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  quality:
    name: Build, test, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore .NET dependencies
        run: dotnet restore HIP.slnx

      - name: Reject vulnerable .NET dependencies
        shell: bash
        run: |
          mkdir -p artifacts/ci
          dotnet package list --project HIP.slnx --vulnerable --include-transitive --format json --output-version 1 > artifacts/ci/nuget-vulnerabilities.json
          jq -e '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]] | length == 0' artifacts/ci/nuget-vulnerabilities.json

      - name: Build solution
        run: dotnet build HIP.slnx --configuration Release --no-restore --warnaserror

      - name: Run API, client, and navigation tests
        run: >-
          dotnet test tests/HIP.Tests/HIP.Tests.csproj --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~HIP.Tests.Ai|FullyQualifiedName~HIP.Tests.Api|FullyQualifiedName~HIP.Tests.Application|FullyQualifiedName~HIP.Tests.Browser|FullyQualifiedName~HIP.Tests.Certificates|FullyQualifiedName~HIP.Tests.Consumer|FullyQualifiedName~HIP.Tests.Devices|FullyQualifiedName~HIP.Tests.Identity|FullyQualifiedName~HIP.Tests.Navigation|FullyQualifiedName~HIP.Tests.Platforms|FullyQualifiedName~HIP.Tests.PublicLookup|FullyQualifiedName~HIP.Tests.Reporting|FullyQualifiedName~HIP.Tests.Reputation|FullyQualifiedName~HIP.Tests.Review|FullyQualifiedName~HIP.Tests.Rules|FullyQualifiedName~HIP.Tests.SecondLife|FullyQualifiedName~HIP.Tests.ServiceClients|FullyQualifiedName~HIP.Tests.Simulation|FullyQualifiedName~HIP.Tests.Support"

      - name: Run infrastructure and security tests
        run: >-
          dotnet test tests/HIP.Tests/HIP.Tests.csproj --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~HIP.Tests.Infrastructure|FullyQualifiedName~HIP.Tests.Observability|FullyQualifiedName~HIP.Tests.Performance|FullyQualifiedName~HIP.Tests.Persistence|FullyQualifiedName~HIP.Tests.Protocol|FullyQualifiedName~HIP.Tests.Scalability|FullyQualifiedName~HIP.Tests.Security|FullyQualifiedName~HIP.Tests.SelfHealing"

      - name: Run scoring and safety tests
        run: >-
          dotnet test tests/HIP.Tests/HIP.Tests.csproj --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~HIP.Tests.Safety|FullyQualifiedName~HIP.Tests.Scoring|FullyQualifiedName~HIP.Tests.SiteSafety"

      - name: Install browser extension dependencies
        working-directory: clients/browser-extension
        run: npm ci

      - name: Reject vulnerable browser extension dependencies
        working-directory: clients/browser-extension
        run: npm audit --audit-level=high

      - name: Check browser extension JavaScript syntax
        shell: bash
        run: find clients/browser-extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run browser extension tests
        working-directory: clients/browser-extension
        run: npm test

  browser-e2e:
    name: Browser extension end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/browser-extension/package-lock.json

      - name: Install browser extension dependencies
        working-directory: clients/browser-extension
        run: npm ci

      - name: Install Chromium
        working-directory: clients/browser-extension
        run: npx playwright install --with-deps chromium

      - name: Run browser extension end-to-end tests
        working-directory: clients/browser-extension
        run: xvfb-run --auto-servernum npm run test:e2e
