name: Publish HIP.Contracts release

on:
  push:
    tags:
      - contracts-v*

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate package and consumer
        shell: pwsh
        run: ./scripts/validate-hip-contracts-package.ps1
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/hip-contracts-package -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifacts/hip-contracts-package/SHA256SUMS.txt
      - name: Publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/hip-contracts-package/HumanInteractiveProtocol.Contracts.0.1.0.nupkg
          artifacts/hip-contracts-package/HumanInteractiveProtocol.Contracts.0.1.0.snupkg
          artifacts/hip-contracts-package/SHA256SUMS.txt
          --repo "${{ github.repository }}"
          --title "HIP.Contracts 0.1.0"
          --notes "Apache-2.0 public interoperability contracts for Human Interactive Protocol."
