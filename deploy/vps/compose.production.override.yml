services:
  dnsdist:
    ports:
      - "${HIP_PUBLIC_BIND_ADDRESS:?HIP_PUBLIC_BIND_ADDRESS is required}:853:853/tcp"
    volumes:
      - ../dnsdist/dnsdist-dot.conf:/etc/dnsdist/conf.d/10-dot.conf:ro
      - ${HIP_DNSDIST_TLS_PATH:?HIP_DNSDIST_TLS_PATH is required}:/etc/dnsdist/tls:ro
    networks: [backend, dns-public]

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HipManagedSigning__Required: "true"
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
    volumes:
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro

  web:
    env_file: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HipDevelopmentProxy__Enabled: "false"
      HipDevelopmentProxy__SharedSecret: ""
      HipManagedSigning__Required: "true"
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
      HipAuthentication__Authority: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}/realms/hip
      HipAuthentication__ClientId: hip-web
      HipAuthentication__ClientSecret: ${HIP_OIDC_CLIENT_SECRET:?HIP_OIDC_CLIENT_SECRET is required}
      HipAuthentication__RoleClaimType: hip_roles
      HipAuthentication__RoleMappings__hip-owner: Owner
      HipAuthentication__RoleMappings__hip-admin: Admin
      HipAuthentication__AcceptStandardMfaAmr: "true"
      HipAuthentication__AcceptPasswordAndOtpMfaAmr: "true"
      HipAuthentication__RecentAuthenticationLifetime: 00:10:00
      HipAuthentication__IdleSessionLifetime: 00:30:00
      HipAuthentication__AbsoluteSessionLifetime: 08:00:00
      HipSessionProtection__KeyRingDirectoryPath: /var/lib/hip/session-keys
      HipSessionProtection__CertificatePath: /run/secrets/hip-session-protection.pfx
      HipSessionProtection__CertificatePassword: ${HIP_SESSION_CERTIFICATE_PASSWORD:?HIP_SESSION_CERTIFICATE_PASSWORD is required}
      HipSessionProtection__ApplicationName: HIP.Web.Public
    volumes:
      - ${HIP_SESSION_KEYRING_PATH:?HIP_SESSION_KEYRING_PATH is required}:/var/lib/hip/session-keys
      - ${HIP_SESSION_CERTIFICATE_PATH:?HIP_SESSION_CERTIFICATE_PATH is required}:/run/secrets/hip-session-protection.pfx:ro
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro

  consumer-web:
    environment:
      HipManagedSigning__Required: "true"
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
    volumes:
      - ${HIP_SESSION_KEYRING_PATH:?HIP_SESSION_KEYRING_PATH is required}:/var/lib/hip/session-keys
      - ${HIP_SESSION_CERTIFICATE_PATH:?HIP_SESSION_CERTIFICATE_PATH is required}:/run/secrets/hip-session-protection.pfx:ro
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro

  caddy:
    environment:
      HIP_DEVELOPMENT_PROXY_SECRET: ""
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  sandbox-worker:
    environment:
      DOTNET_ENVIRONMENT: Production

networks:
  dns-public:
    driver: bridge
