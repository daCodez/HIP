name: hip-staging

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HIP_POSTGRES_DB:?HIP_POSTGRES_DB is required}
      POSTGRES_USER: ${HIP_POSTGRES_USER:?HIP_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${HIP_POSTGRES_PASSWORD:?HIP_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue:
    image: rabbitmq:4-alpine@sha256:c07a5e60f5429be18b3b7fd3a4dfa9a84c3372f88df084b6f2b22224192c360c
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${HIP_RABBITMQ_USER:?HIP_RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${HIP_RABBITMQ_PASSWORD:?HIP_RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  unbound:
    image: guardwithhip/unbound:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: deploy/unbound/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1655:1655"
    read_only: true
    tmpfs:
      - /tmp:uid=1655,gid=1655,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    volumes:
      - unbound-data:/var/lib/unbound
    networks: [backend, egress]

  dnsdist:
    image: guardwithhip/dnsdist:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: deploy/dnsdist/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "953:953"
    read_only: true
    tmpfs:
      - /tmp:uid=953,gid=953,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    networks: [backend]
    depends_on:
      unbound: { condition: service_healthy }

  powerdns:
    image: guardwithhip/powerdns:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: deploy/powerdns/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1656:1656"
    read_only: true
    tmpfs:
      - /run/pdns:uid=1656,gid=1656,mode=0700
      - /tmp:uid=1656,gid=1656,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    environment:
      HIP_POWERDNS_API_KEY: ${HIP_POWERDNS_API_KEY:?HIP_POWERDNS_API_KEY is required}
    volumes:
      - powerdns-data:/var/lib/powerdns
    networks: [backend]

  keycloak:
    image: guardwithhip/identity:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: deploy/keycloak/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    command:
      - start
      - --optimized
      - --import-realm
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=0,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
      KC_HOSTNAME: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      HIP_OIDC_CLIENT_SECRET: ${HIP_OIDC_CLIENT_SECRET:?HIP_OIDC_CLIENT_SECRET is required}
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/import:/opt/keycloak/data/import:ro
    networks: [backend, egress]
    depends_on:
      keycloak-db: { condition: service_healthy }

  api:
    image: guardwithhip/api:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: src/HIP.ApiService/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      HipCertificates__PublicOrigin: https://guardwithhip.com
      ConnectionStrings__HipDatabase: Host=postgres;Port=5432;Database=${HIP_POSTGRES_DB:?HIP_POSTGRES_DB is required};Username=${HIP_POSTGRES_USER:?HIP_POSTGRES_USER is required};Password=${HIP_POSTGRES_PASSWORD:?HIP_POSTGRES_PASSWORD is required}
      ConnectionStrings__redis: redis:6379,abortConnect=false
      HipInfrastructure__DatabaseProvider: PostgreSQL
      HipSecurity__RecordEncryptionKey: ${HIP_RECORD_ENCRYPTION_KEY:?HIP_RECORD_ENCRYPTION_KEY is required}
      HipSecurity__LegacyRecordEncryptionKeys__0: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_0:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_0 is required}
      HipSecurity__LegacyRecordEncryptionKeys__1: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_1:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_1 is required}
      HipSecurity__PrivacyHashingKey: ${HIP_PRIVACY_HASHING_KEY:?HIP_PRIVACY_HASHING_KEY is required}
      HipSecurity__LegacyPrivacyHashingKeys__0: ${HIP_LEGACY_PRIVACY_HASHING_KEY_0:?HIP_LEGACY_PRIVACY_HASHING_KEY_0 is required}
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
      ExternalSiteEvidence__ExternalProvidersEnabled: "true"
      ExternalSiteEvidence__SslLabs__Enabled: "true"
      ExternalSiteEvidence__GoogleWebRisk__Enabled: "false"
      ExternalSiteEvidence__VirusTotal__Enabled: "false"
      DnsVerification__NameServerHost: dnsdist
      DnsVerification__NameServerPort: "5353"
      DnsVerification__TrustDnssecValidation: "true"
    ports:
      - "127.0.0.1:5099:8080"
    volumes:
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      queue: { condition: service_healthy }
      dnsdist: { condition: service_healthy }

  web:
    image: guardwithhip/admin-web:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: src/HIP.Web/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=1777
      - /home/app/.aspnet/DataProtection-Keys:uid=1654,gid=1654,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HipCertificates__PublicOrigin: https://guardwithhip.com
      HipPortalLinks__PublicOrigin: https://${HIP_PUBLIC_HOST:?HIP_PUBLIC_HOST is required}
      HipPortalLinks__ConsumerOrigin: https://${HIP_CONSUMER_HOST:?HIP_CONSUMER_HOST is required}
      HipPortalLinks__AdminOrigin: https://${HIP_ADMIN_HOST:?HIP_ADMIN_HOST is required}
      HipPortalLinks__ApiOrigin: https://${HIP_API_HOST:?HIP_API_HOST is required}
      HipPortalLinks__IdentityOrigin: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}
      ConnectionStrings__HipDatabase: Host=postgres;Port=5432;Database=${HIP_POSTGRES_DB:?HIP_POSTGRES_DB is required};Username=${HIP_POSTGRES_USER:?HIP_POSTGRES_USER is required};Password=${HIP_POSTGRES_PASSWORD:?HIP_POSTGRES_PASSWORD is required}
      ConnectionStrings__redis: redis:6379,abortConnect=false
      HipInfrastructure__DatabaseProvider: PostgreSQL
      HipSecurity__RecordEncryptionKey: ${HIP_RECORD_ENCRYPTION_KEY:?HIP_RECORD_ENCRYPTION_KEY is required}
      HipSecurity__LegacyRecordEncryptionKeys__0: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_0:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_0 is required}
      HipSecurity__LegacyRecordEncryptionKeys__1: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_1:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_1 is required}
      HipSecurity__PrivacyHashingKey: ${HIP_PRIVACY_HASHING_KEY:?HIP_PRIVACY_HASHING_KEY is required}
      HipSecurity__LegacyPrivacyHashingKeys__0: ${HIP_LEGACY_PRIVACY_HASHING_KEY_0:?HIP_LEGACY_PRIVACY_HASHING_KEY_0 is required}
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Required: "true"
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
      HipDevelopmentProxy__Enabled: "false"
      HipDevelopmentProxy__SharedSecret: ""
      HipAuthentication__Authority: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}/realms/hip
      HipAuthentication__ClientId: hip-web
      HipAuthentication__ClientSecret: ${HIP_OIDC_CLIENT_SECRET:?HIP_OIDC_CLIENT_SECRET is required}
      HipAuthentication__RoleClaimType: hip_roles
      HipAuthentication__RoleMappings__hip-owner: Owner
      HipAuthentication__RoleMappings__hip-admin: Admin
      HipAuthentication__AcceptStandardMfaAmr: "true"
      HipAuthentication__AcceptPasswordAndOtpMfaAmr: "true"
      HipAuthentication__RecentAuthenticationLifetime: 00:10:00
      HipAuthentication__IdleSessionLifetime: 00:30:00
      HipAuthentication__AbsoluteSessionLifetime: 08:00:00
      HipSessionProtection__KeyRingDirectoryPath: /var/lib/hip/session-keys
      HipSessionProtection__CertificatePath: /run/secrets/hip-session-protection.pfx
      HipSessionProtection__CertificatePassword: ${HIP_SESSION_CERTIFICATE_PASSWORD:?HIP_SESSION_CERTIFICATE_PASSWORD is required}
      HipSessionProtection__ApplicationName: HIP.Web.Admin
      services__hip-api__http__0: http://api:8080
      ExternalSiteEvidence__ExternalProvidersEnabled: "true"
      ExternalSiteEvidence__SslLabs__Enabled: "true"
      ExternalSiteEvidence__GoogleWebRisk__Enabled: "false"
      ExternalSiteEvidence__VirusTotal__Enabled: "false"
      AuthoritativeDns__Enabled: "true"
      AuthoritativeDns__ApiBaseUrl: http://powerdns:8081/api/v1/
      AuthoritativeDns__ApiKey: ${HIP_POWERDNS_API_KEY:?HIP_POWERDNS_API_KEY is required}
      AuthoritativeDns__NameServers__0: ns1.guardwithhip.com.
      AuthoritativeDns__NameServers__1: ns2.guardwithhip.com.
    ports:
      - "127.0.0.1:5123:8080"
    volumes:
      - ${HIP_SESSION_KEYRING_PATH:?HIP_SESSION_KEYRING_PATH is required}:/var/lib/hip/session-keys
      - ${HIP_SESSION_CERTIFICATE_PATH:?HIP_SESSION_CERTIFICATE_PATH is required}:/run/secrets/hip-session-protection.pfx:ro
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro
    networks: [backend, egress]
    depends_on:
      api: { condition: service_healthy }
      powerdns: { condition: service_healthy }

  consumer-web:
    image: guardwithhip/consumer-web:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: src/HIP.Web/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HipCertificates__PublicOrigin: https://guardwithhip.com
      HipPortalLinks__PublicOrigin: https://${HIP_PUBLIC_HOST:?HIP_PUBLIC_HOST is required}
      HipPortalLinks__ConsumerOrigin: https://${HIP_CONSUMER_HOST:?HIP_CONSUMER_HOST is required}
      HipPortalLinks__AdminOrigin: https://${HIP_ADMIN_HOST:?HIP_ADMIN_HOST is required}
      HipPortalLinks__ApiOrigin: https://${HIP_API_HOST:?HIP_API_HOST is required}
      HipPortalLinks__IdentityOrigin: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}
      ConnectionStrings__HipDatabase: Host=postgres;Port=5432;Database=${HIP_POSTGRES_DB:?HIP_POSTGRES_DB is required};Username=${HIP_POSTGRES_USER:?HIP_POSTGRES_USER is required};Password=${HIP_POSTGRES_PASSWORD:?HIP_POSTGRES_PASSWORD is required}
      ConnectionStrings__redis: redis:6379,abortConnect=false
      HipInfrastructure__DatabaseProvider: PostgreSQL
      HipSecurity__RecordEncryptionKey: ${HIP_RECORD_ENCRYPTION_KEY:?HIP_RECORD_ENCRYPTION_KEY is required}
      HipSecurity__LegacyRecordEncryptionKeys__0: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_0:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_0 is required}
      HipSecurity__LegacyRecordEncryptionKeys__1: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_1:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_1 is required}
      HipSecurity__PrivacyHashingKey: ${HIP_PRIVACY_HASHING_KEY:?HIP_PRIVACY_HASHING_KEY is required}
      HipSecurity__LegacyPrivacyHashingKeys__0: ${HIP_LEGACY_PRIVACY_HASHING_KEY_0:?HIP_LEGACY_PRIVACY_HASHING_KEY_0 is required}
      HipManagedSigning__Required: "true"
      HipManagedSigning__ExpectedIssuerId: ${HIP_SIGNING_ISSUER_ID:?HIP_SIGNING_ISSUER_ID is required}
      HipManagedSigning__ExpectedKeyId: ${HIP_SIGNING_KEY_ID:?HIP_SIGNING_KEY_ID is required}
      HipManagedSigning__ExpectedAlgorithm: ML-DSA-65
      HipManagedSigning__Provider: SoftHsm
      HipManagedSigning__SoftHsm__LibraryPath: /usr/local/lib/softhsm/libsofthsm2.so
      HipManagedSigning__SoftHsm__TokenLabel: hip-signing
      HipManagedSigning__SoftHsm__UserPinFilePath: /run/secrets/hip-softhsm-user-pin
      HipManagedSigning__SoftHsm__KeyLabel: hip-mldsa-65
      HipManagedSigning__SoftHsm__ProvisioningLockFilePath: /var/lib/softhsm/hip-signing-provision.lock
      HipManagedSigning__SoftHsm__ProvisionKeyIfMissing: "true"
      HipAuthentication__Authority: https://${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}/realms/hip
      HipAuthentication__ClientId: hip-web
      HipAuthentication__ClientSecret: ${HIP_OIDC_CLIENT_SECRET:?HIP_OIDC_CLIENT_SECRET is required}
      HipAuthentication__RoleClaimType: hip_roles
      HipAuthentication__RoleMappings__hip-owner: Owner
      HipAuthentication__RoleMappings__hip-admin: Admin
      HipAuthentication__AcceptStandardMfaAmr: "true"
      HipAuthentication__AcceptPasswordAndOtpMfaAmr: "true"
      HipAuthentication__RecentAuthenticationLifetime: 00:10:00
      HipAuthentication__IdleSessionLifetime: 00:30:00
      HipAuthentication__AbsoluteSessionLifetime: 08:00:00
      HipSessionProtection__KeyRingDirectoryPath: /var/lib/hip/session-keys
      HipSessionProtection__CertificatePath: /run/secrets/hip-session-protection.pfx
      HipSessionProtection__CertificatePassword: ${HIP_SESSION_CERTIFICATE_PASSWORD:?HIP_SESSION_CERTIFICATE_PASSWORD is required}
      HipSessionProtection__ApplicationName: HIP.Web.Consumer
      services__hip-api__http__0: http://api:8080
      ExternalSiteEvidence__ExternalProvidersEnabled: "true"
      ExternalSiteEvidence__SslLabs__Enabled: "true"
      ExternalSiteEvidence__GoogleWebRisk__Enabled: "false"
      ExternalSiteEvidence__VirusTotal__Enabled: "false"
    volumes:
      - ${HIP_SESSION_KEYRING_PATH:?HIP_SESSION_KEYRING_PATH is required}:/var/lib/hip/session-keys
      - ${HIP_SESSION_CERTIFICATE_PATH:?HIP_SESSION_CERTIFICATE_PATH is required}:/run/secrets/hip-session-protection.pfx:ro
      - ${HIP_SOFTHSM_TOKEN_PATH:?HIP_SOFTHSM_TOKEN_PATH is required}:/var/lib/softhsm
      - ${HIP_SOFTHSM_USER_PIN_PATH:?HIP_SOFTHSM_USER_PIN_PATH is required}:/run/secrets/hip-softhsm-user-pin:ro
    ports:
      - "127.0.0.1:5124:8080"
    networks: [backend, egress]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_started }

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      HIP_PUBLIC_HOST: ${HIP_PUBLIC_HOST:?HIP_PUBLIC_HOST is required}
      HIP_CONSUMER_HOST: ${HIP_CONSUMER_HOST:?HIP_CONSUMER_HOST is required}
      HIP_ADMIN_HOST: ${HIP_ADMIN_HOST:?HIP_ADMIN_HOST is required}
      HIP_API_HOST: ${HIP_API_HOST:?HIP_API_HOST is required}
      HIP_IDENTITY_HOST: ${HIP_IDENTITY_HOST:?HIP_IDENTITY_HOST is required}
      HIP_DNS_HOST: ${HIP_DNS_HOST:?HIP_DNS_HOST is required}
      HIP_DEVELOPMENT_PROXY_SECRET: ${HIP_DEVELOPMENT_PROXY_SECRET:?HIP_DEVELOPMENT_PROXY_SECRET is required}
    ports:
      - "${HIP_PUBLIC_BIND_ADDRESS:?HIP_PUBLIC_BIND_ADDRESS is required}:80:80"
      - "${HIP_PUBLIC_BIND_ADDRESS:?HIP_PUBLIC_BIND_ADDRESS is required}:443:443"
      - "${HIP_PUBLIC_BIND_ADDRESS:?HIP_PUBLIC_BIND_ADDRESS is required}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend, egress]
    depends_on:
      web: { condition: service_healthy }
      consumer-web: { condition: service_healthy }
      keycloak: { condition: service_started }

  sandbox-worker:
    image: guardwithhip/sandbox-worker:${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
    build:
      context: ../..
      dockerfile: src/HIP.SandboxWorker/Dockerfile
      args:
        HIP_RELEASE_REVISION: ${HIP_RELEASE_REVISION:?HIP_RELEASE_REVISION is required}
        HIP_RELEASE_VERSION: ${HIP_RELEASE_VERSION:?HIP_RELEASE_VERSION is required}
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      DOTNET_ENVIRONMENT: Development
      HipCertificates__PublicOrigin: https://guardwithhip.com
      ConnectionStrings__HipDatabase: Host=postgres;Port=5432;Database=${HIP_POSTGRES_DB:?HIP_POSTGRES_DB is required};Username=${HIP_POSTGRES_USER:?HIP_POSTGRES_USER is required};Password=${HIP_POSTGRES_PASSWORD:?HIP_POSTGRES_PASSWORD is required}
      ConnectionStrings__redis: redis:6379,abortConnect=false
      HipInfrastructure__DatabaseProvider: PostgreSQL
      HipSecurity__RecordEncryptionKey: ${HIP_RECORD_ENCRYPTION_KEY:?HIP_RECORD_ENCRYPTION_KEY is required}
      HipSecurity__LegacyRecordEncryptionKeys__0: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_0:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_0 is required}
      HipSecurity__LegacyRecordEncryptionKeys__1: ${HIP_LEGACY_RECORD_ENCRYPTION_KEY_1:?HIP_LEGACY_RECORD_ENCRYPTION_KEY_1 is required}
      HipSecurity__PrivacyHashingKey: ${HIP_PRIVACY_HASHING_KEY:?HIP_PRIVACY_HASHING_KEY is required}
      HipSecurity__LegacyPrivacyHashingKeys__0: ${HIP_LEGACY_PRIVACY_HASHING_KEY_0:?HIP_LEGACY_PRIVACY_HASHING_KEY_0 is required}
      SandboxWorker__Enabled: "true"
      SandboxWorker__BatchSize: "5"
      SandboxWorker__ExecuteBrowserSandbox: "false"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
  keycloak-data:
  keycloak-postgres-data:
  unbound-data:
  powerdns-data:
