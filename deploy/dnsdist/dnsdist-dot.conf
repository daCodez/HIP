-- Production-only encrypted DNS listeners. Plain DNS remains available only
-- on the un-published Docker network for HIP application traffic.
setACL({"0.0.0.0/0", "::/0"})
setMaxTLSNewSessionRatePerClient(10)
setMaxTLSResumedSessionRatePerClient(50)
addAction(MaxQPSIPRule(50, 32, 64, 100, 300, 60, 10, 10), DropAction())
addAction(NotRule(MaxQPSRule(5000)), DropAction())

addTLSLocal(
    "0.0.0.0:853",
    "/etc/dnsdist/tls/dns.guardwithhip.com.crt",
    "/etc/dnsdist/tls/dns.guardwithhip.com.key",
    {
        provider="openssl",
        minTLSVersion="tls1.2",
        numberOfStoredSessions=0,
        maxConcurrentTCPConnections=512,
        releaseBuffers=true,
        enableRenegotiation=false
    })

-- DNS-over-QUIC uses the same certificate and bounded query rules as DoT.
-- QLOG and TLS key logging remain disabled so transport secrets and query
-- metadata are not written to disk.
addDOQLocal(
    "0.0.0.0:853",
    "/etc/dnsdist/tls/dns.guardwithhip.com.crt",
    "/etc/dnsdist/tls/dns.guardwithhip.com.key",
    {
        idleTimeout=5,
        maxInFlight=64,
        congestionControlAlgo="cubic"
    })

local privateMaintenance = maintenance
local certificateReloadTicks = 0

function maintenance()
    privateMaintenance()
    certificateReloadTicks = certificateReloadTicks + 1
    if certificateReloadTicks >= 300 then
        reloadAllCertificates()
        certificateReloadTicks = 0
    end
end
